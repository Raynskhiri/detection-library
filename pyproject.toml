[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-library"
version = "0.1.0"
description = "Detections written once, compiled to Cortex XDR XQL and Splunk SPL, proven with test events"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rayen Skhiri" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["detection-engineering", "threat-hunting", "cortex-xdr", "xql", "splunk", "spl", "sysmon", "mitre-attack"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
detlib = "detlib.cli:main"

[tool.setuptools]
packages = ["detlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
