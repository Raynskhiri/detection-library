name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -r requirements.txt pytest
      - name: Rule tests and intrusion scenario
        run: python -m detlib test
      - name: Compiled XQL/SPL and the browser engine agree with the rules
        run: python -m pytest -q
      - name: build/, docs/ and site/data are up to date
        run: python -m detlib build --check

  browser-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Playground engine tests (no dependencies)
        run: node --test site/engine.test.mjs
