name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Rule tests
        run: python -m detlib test
      - name: Compiled XQL and SPL agree with the rules
        run: python -m pytest -q
      - name: build/ and docs/ are up to date
        run: python -m detlib build --check
