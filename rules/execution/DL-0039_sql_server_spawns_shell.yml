id: DL-0039
title: SQL Server starts a shell (xp_cmdshell)
description: >
  sqlservr.exe starting cmd.exe or PowerShell means xp_cmdshell or a CLR assembly is running
  OS commands. Attackers reach it through database links, a sysadmin login, or a
  trustworthy database, and use it to move to the next server.
attack: [T1059.003, T1505.001]
tactic: execution
severity: high
logsource: process_creation
detection:
  selection:
    parent.name: sqlservr.exe
    process.name: [cmd.exe, powershell.exe, pwsh.exe, rundll32.exe, certutil.exe, bitsadmin.exe, whoami.exe]
  condition: selection
false_positives:
  - Maintenance jobs that call xp_cmdshell on purpose. They are scheduled and repeat the same command.
triage:
  - In the SQL Server logs, find the login that ran xp_cmdshell and any linked server queries (EXECUTE AT, OPENQUERY).
  - Disable xp_cmdshell, remove sysadmin from links, and run the SQL service as a low-privilege gMSA.
tests:
  match:
    - parent.name: sqlservr.exe
      process.name: cmd.exe
      process.command_line: 'cmd.exe /c whoami'
  no_match:
    - parent.name: sqlservr.exe
      process.name: sqlwriter.exe
      process.command_line: 'sqlwriter.exe'
references:
  - https://attack.mitre.org/techniques/T1505/001/
