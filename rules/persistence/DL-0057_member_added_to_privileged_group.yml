id: DL-0057
title: Member added to a privileged domain group
description: >
  Events 4728, 4732 and 4756 (member added to a global, local or universal group) for Domain
  Admins, Enterprise Admins, Schema Admins, Administrators and the operator groups. These
  groups change rarely, so every addition deserves a look.
attack: [T1098.007]
tactic: persistence
severity: high
logsource: windows_event
detection:
  added:
    event.id: [4728, 4732, 4756]
    target.user: ['Domain Admins', 'Enterprise Admins', 'Schema Admins', Administrators, 'Account Operators',
                  'Backup Operators', 'Server Operators', 'DnsAdmins', 'Group Policy Creator Owners', 'Key Admins',
                  'Enterprise Key Admins']
  condition: added
false_positives:
  - Planned admin changes. Match them against change tickets.
triage:
  - Confirm with the person who made the change (subject account). If nobody expected it, remove the member and reset the account.
  - Look at the member's recent logons and what they touched with the new rights.
tests:
  match:
    - event.id: 4728
      subject.user: techservice
      target.user: 'Domain Admins'
      member.name: 'CN=studentx,CN=Users,DC=corp,DC=local'
  no_match:
    - event.id: 4728
      target.user: 'Marketing'
      member.name: 'CN=a.trabelsi,CN=Users,DC=corp,DC=local'
references:
  - https://attack.mitre.org/techniques/T1098/007/
