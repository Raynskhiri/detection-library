id: DL-0054
title: Key credential added to an account (shadow credentials)
description: >
  Event 5136 writing msDS-KeyCredentialLink. Windows Hello for Business writes this
  attribute on enrollment, but an attacker with write rights on an account can add their own
  key and then log on as that account with a certificate (PKINIT), without knowing or
  changing its password.
attack: [T1098, T1556]
tactic: persistence
severity: high
logsource: windows_event
detection:
  key_link:
    event.id: 5136
    attribute.name: msDS-KeyCredentialLink
  condition: key_link
false_positives:
  - Windows Hello for Business enrollment. Those are written by the computer account of the device, for the user who enrolled.
triage:
  - If the writer is not the device itself, list and remove unknown keys on the account (Whisker list / Get-ADUser -Properties msDS-KeyCredentialLink).
  - Expect a PKINIT logon for the same account soon after (DL-0050).
tests:
  match:
    - event.id: 5136
      subject.user: studentx
      object.dn: 'CN=techservice,CN=Users,DC=tech,DC=corp'
      attribute.name: msDS-KeyCredentialLink
  no_match:
    - event.id: 5136
      attribute.name: msDS-AllowedToDelegateTo
references:
  - https://posts.specterops.io/shadow-credentials-abusing-key-trust-account-mapping-for-takeover-8ee1a53566ab
