id: DL-0077
title: Secret or certificate added to an Entra ID app by another app or by a script
description: >
  A client secret or certificate was added to an application or service principal ("Add
  service principal credentials", or "Update application - Certificates and secrets
  management"), and the change came from an application rather than a person, or from a
  scripting client (python-requests, Python-urllib, curl). A credential on an app is a backdoor
  that survives password resets, MFA and the vendor fixing its own breach. In the October 2026
  ConnectWise compromise, a Python script added new secrets to an MSP management app and to a
  security vendor's app minutes after taking Global Administrator.
attack: [T1098.001]
tactic: persistence
severity: high
logsource: entra_audit
detection:
  credential_added:
    audit.operation|re: '^(add service principal credentials|update application.*certificates and secrets)'
  by_an_app:
    initiator.app|re: '.+'
  scripted:
    user_agent|re: '(python-requests|python-urllib|curl/|go-http-client|azure-toolkit)'
  condition: credential_added and (by_an_app or scripted)
false_positives:
  - Secret rotation done by your own automation (Key Vault rotation, Terraform or a DevOps service principal). Allow-list that app by ID, not by name.
triage:
  - Open the target app's credentials and note the key ID, type, start and end dates. Attackers often pick long lifetimes; reporting on this campaign called out new secrets that expire in 2028.
  - Check whether the initiating app recently gained a directory role (DL-0076). Self-assigned role then new secrets is the full Storm-0940 chain.
  - Remove the credential, then review every sign-in by the target app since the credential was created. Removing it does not undo what was already read.
tests:
  match:
    - audit.operation: Add service principal credentials
      audit.category: ApplicationManagement
      initiator.app: ConnectWise Cloud Management - MS Teams
      target.type: ServicePrincipal
      target.name: Huntress Security Platform
      user_agent: Python-urllib/3.12
    - audit.operation: Update application - Certificates and secrets management
      audit.category: ApplicationManagement
      initiator.user: compromised.admin@contoso.tn
      target.type: Application
      target.name: RMM Integration
      user_agent: python-requests/2.34.2
  no_match:
    - audit.operation: Update application - Certificates and secrets management
      audit.category: ApplicationManagement
      initiator.user: it.admin@contoso.tn
      target.type: Application
      target.name: HR Portal
      user_agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36'
    - audit.operation: Add service principal
      initiator.app: Microsoft Graph Command Line Tools
      target.type: ServicePrincipal
      target.name: New Partner App
references:
  - https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/
  - https://thehackernews.com/2026/10/hackers-use-compromised-connectwise.html
  - https://research.splunk.com/cloud/e3adc0d3-9e4b-4b5d-b662-12cec1adff2a
