id: DL-0059
title: DSRM administrator password changed
description: >
  Event 4794 on a domain controller: someone set the Directory Services Restore Mode
  administrator password. Combined with DsrmAdminLogonBehavior (DL-0041), that account
  becomes a quiet backdoor into the DC.
attack: [T1098]
tactic: persistence
severity: high
logsource: windows_event
detection:
  dsrm:
    event.id: 4794
  condition: dsrm
false_positives:
  - DC builds and planned DSRM password rotation.
triage:
  - Check the subject account and whether a change was planned. If not, reset the DSRM password and check DL-0041 on the same DC.
tests:
  match:
    - event.id: 4794
      subject.user: Administrator
  no_match:
    - event.id: 4724
      subject.user: Administrator
references:
  - https://adsecurity.org/?p=1785
