id: DL-0031
title: Rubeus requests, forges or injects Kerberos tickets
description: >
  Rubeus verbs used after the first foothold: asktgt with a hash or key (overpass-the-hash),
  s4u (delegation abuse), ptt (pass-the-ticket), tgtdeleg, golden, silver and diamond ticket
  forging, and monitor (catching TGTs on a host with unconstrained delegation). Also catches
  Rubeus run through an in-memory loader, since the arguments stay on the command line.
attack: [T1558, T1550.003, T1550.002]
tactic: credential-access
severity: critical
logsource: process_creation
detection:
  rubeus_verb:
    process.command_line|re: '\b(asktgt|asktgs|s4u|ptt|tgtdeleg|golden|silver|diamond|monitor|harvest|dump|triage|createnetonly|renew)\b'
  ticket_args:
    process.command_line|contains: ['/rc4:', '/aes256:', '/aes128:', '/ticket:', '/impersonateuser:', '/msdsspn:',
                                    '/certificate:', '/krbkey:', '/ptt', '/nowrap', '/interval:']
  rubeus_name:
    process.command_line|contains: rubeus
  condition: rubeus_verb and (ticket_args or rubeus_name)
false_positives:
  - Red team exercises. klist and normal Kerberos use do not match.
triage:
  - "/rc4: or /aes256: means a stolen key is being used: find where it came from (LSASS dump, DCSync) and reset that account."
  - "s4u with /impersonateuser points to delegation abuse: check msDS-AllowedToActOnBehalfOfOtherIdentity and msDS-AllowedToDelegateTo on the target service."
  - golden, silver or diamond means forged tickets. Plan a double krbtgt reset if krbtgt keys were exposed.
tests:
  match:
    - process.name: rubeus.exe
      process.command_line: 'Rubeus.exe asktgt /user:svcadmin /aes256:6366243a657a4ea04e406f1abc27f1ada358ccd0138ec5ca2835067719dc7011 /opsec /ptt'
    - process.name: loader.exe
      process.command_line: 'Loader.exe -path http://127.0.0.1:8080/Rubeus.exe -args s4u /user:dcorp-adminsrv$ /aes256:aaaa /impersonateuser:Administrator /msdsspn:CIFS/dcorp-mgmt /ptt'
    - process.name: rubeus.exe
      process.command_line: 'Rubeus.exe monitor /interval:5 /nowrap'
  no_match:
    - process.name: klist.exe
      process.command_line: 'klist purge'
    - process.name: powershell.exe
      process.command_line: 'powershell Write-Host "golden hour photo export"'
references:
  - https://github.com/GhostPack/Rubeus
