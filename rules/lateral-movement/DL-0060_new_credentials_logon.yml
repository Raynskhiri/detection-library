id: DL-0060
title: Logon with new credentials (logon type 9, overpass-the-hash)
description: >
  Event 4624 with logon type 9 and the seclogo logon process. It is what runas /netonly
  creates, and also what mimikatz sekurlsa::pth and Rubeus createnetonly create when they
  start a process that uses a stolen hash or ticket for network access.
attack: [T1550.002, T1134.002]
tactic: lateral-movement
severity: medium
logsource: windows_event
detection:
  netonly:
    event.id: 4624
    logon.type: '9'
    logon.process|contains: seclogo
  condition: netonly
false_positives:
  - Admins using runas /netonly to manage other domains. Baseline the hosts and accounts.
triage:
  - Find the process that started the logon session and what it connected to.
  - Any type 9 logon on a workstation of a normal user is worth asking about.
tests:
  match:
    - event.id: 4624
      target.user: studentx
      logon.type: '9'
      logon.process: 'seclogo'
      auth.package: Negotiate
  no_match:
    - event.id: 4624
      target.user: studentx
      logon.type: '3'
      logon.process: 'Kerberos'
references:
  - https://attack.mitre.org/techniques/T1550/002/
