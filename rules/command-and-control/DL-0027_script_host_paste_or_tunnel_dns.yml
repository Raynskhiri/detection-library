id: DL-0027
title: Script host or LOLBin looks up a paste site, file drop or tunnel service
description: >
  PowerShell, a script host or a LOLBin resolves pastebin, raw GitHub content, a temporary
  file host, an ngrok or Cloudflare tunnel, Discord CDN or the Telegram bot API. These free
  services host payloads and act as C2 because they are rarely blocked.
attack: [T1102, T1105, T1572]
tactic: command-and-control
severity: medium
logsource: dns_query
detection:
  process:
    process.name: [powershell.exe, pwsh.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe,
                   certutil.exe, bitsadmin.exe, cmd.exe, msbuild.exe]
  service:
    dns.query|re: '(^|\.)(pastebin\.com|paste\.ee|hastebin\.com|rentry\.co|raw\.githubusercontent\.com|transfer\.sh|file\.io|gofile\.io|temp\.sh|ngrok\.io|ngrok-free\.app|trycloudflare\.com|cdn\.discordapp\.com|api\.telegram\.org)\.?$'
  condition: process and service
false_positives:
  - Admin or developer scripts that pull from raw.githubusercontent.com. Allowlist by script and repo.
triage:
  - Find the URL in proxy logs or the process command line and fetch the content safely.
  - Check what the process did after the lookup (new files, child processes).
tests:
  match:
    - process.name: powershell.exe
      dns.query: pastebin.com
    - process.name: mshta.exe
      dns.query: abcd-1234.trycloudflare.com
  no_match:
    - process.name: chrome.exe
      dns.query: pastebin.com
    - process.name: powershell.exe
      dns.query: notpastebin.com.evil.example
