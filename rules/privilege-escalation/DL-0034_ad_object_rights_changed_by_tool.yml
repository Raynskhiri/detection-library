id: DL-0034
title: AD object rights or memberships changed with PowerView or StandIn
description: >
  Write actions from PowerView and StandIn: granting rights on an object (Add-DomainObjectAcl,
  including DCSync rights), setting attributes (Set-DomainObject), adding group members,
  resetting passwords, or writing resource-based constrained delegation (StandIn --computer
  --sid). These turn a weak ACL into a working escalation path.
attack: [T1098]
tactic: privilege-escalation
severity: high
logsource: process_creation
detection:
  powerview_write:
    process.command_line|contains: [add-domainobjectacl, set-domainobject, add-domaingroupmember,
                                    set-domainuserpassword, set-domainobjectowner, add-objectacl]
  standin_write:
    process.command_line|contains: standin
    process.command_line|re: '(--computer\b.*--sid|--group\b.*--add|--setuserrights|--grant|--spn|--setpassword)'
  condition: powerview_write or standin_write
false_positives:
  - AD administrators using PowerView in scripts. Uncommon; most admins use the ActiveDirectory module.
triage:
  - On the DC, find the matching 5136 (attribute changed) or 4728/4732/4756 (member added) events and the object that changed.
  - Undo the change, then look for what the attacker did with it next (new delegation, DCSync, password reset logon).
tests:
  match:
    - process.name: powershell.exe
      process.command_line: 'powershell Add-DomainObjectAcl -TargetIdentity "dc=corp,dc=local" -PrincipalIdentity studentx -Rights DCSync'
    - process.name: standin.exe
      process.command_line: 'StandIn.exe --computer srv01 --sid S-1-5-21-1-2-3-1106'
    - process.name: standin.exe
      process.command_line: 'StandIn.exe --group Management --ntaccount "corp\svc" --add'
  no_match:
    - process.name: standin.exe
      process.command_line: 'StandIn.exe --group "Domain Admins"'
    - process.name: powershell.exe
      process.command_line: 'powershell Get-DomainObjectAcl -Identity srv01'
references:
  - https://github.com/FuzzySecurity/StandIn
